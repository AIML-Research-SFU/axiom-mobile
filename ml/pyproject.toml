[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "axiom-mobile-ml"
version = "0.1.0"
description = "Baseline ML utilities and experiment runners for AXIOM-Mobile."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
train = [
    "torch>=2.1",
    "torchvision>=0.16",
    "Pillow>=10.0",
    "numpy>=1.24",
    # Pinned, not >=: transformers 5.x's newer internal attention-mask
    # construction (a `new_ones` op) is not implemented by coremltools
    # 9.0's PyTorch frontend. Verified transformers==4.44.2/peft==0.13.2
    # converts cleanly (with the static-position_ids fix in
    # axiom_lora_text.py) against the current torch; unpin only after
    # confirming a newer transformers converts too.
    "transformers==4.44.2",
    "peft==0.13.2",
]
export = [
    "torch>=2.1",
    "torchvision>=0.16",
    "Pillow>=10.0",
    "numpy>=1.24",
    "coremltools>=8.0",
    "transformers==4.44.2",
    "peft==0.13.2",
]
dev = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
